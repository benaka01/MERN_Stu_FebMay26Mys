<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attiribute and pseudo selector </title>
    <style>
        /* Attribute Selector */
        input[type="text"] {
            border: 2px dotted blue;
            padding: 10px;
            font-size: 16px;
        }
        /* Pseudo Selector */
        button:hover {
            background-color: yellow;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <input type="text" placeholder="This input is styled">
    <input type="password" placeholder="This input is not styled">
    <button>Hover on me</button>
</body>
</html>
