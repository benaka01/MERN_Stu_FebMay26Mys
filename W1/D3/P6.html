<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Element CSS</title>
    <style>
        /* Element Selector */
        body {
            background-color: rgb(139, 248, 194);
        }
        h1 {
            color: blue;
        }
        p {
            font-size: 20px;
            color: red;
            font-style: italic;
            font:family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <h1>This is a heading with internal CSS</h1>
    <p>This is a paragraph with internal CSS</p>

</body>
</html>
