<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Class CSS</title>
    <style>
        /* Class Selector */
        .Paratype1 {
            background-color: aqua;
            font-weight: bold;
            font-size: 20px;
            color: red;
            font-style: italic;
            font-family: Arial, sans-serif;
        }
        .Paratype2 {
            font-size: 18px;
            color: green;
            font-style: normal;
            font-family: Verdana, sans-serif;
        }
        /* ID Selector */
        #main-title {
            text-decoration: underline;
            color: purple;
            text-align: center;

        }
         
    </style>
</head>
<body>
    <!-- class Selector -->
    <p class="Paratype1">This is a paragraph1 with internal CSS</p>
    <p class="Paratype2">This is a paragraph2 with internal CSS</p>
    <!-- ID Selector -->
    <h1 id="main-title">Main Heading</h1>
</body>
</html>
