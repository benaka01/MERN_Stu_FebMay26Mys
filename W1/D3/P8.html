<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Selector & Grouping selector</title>
    <style>
        /* Universal Selector */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:  Arial, sans-serif;
            color: red;
        }
        /* Grouping selector */
        h1,h3{
            color: blue;
        }
    </style>
</head>
<body>
    <h1>This is a Heading one</h1>
    <h2>All elements have zero margin and zero padding</h2>
    <h3>This is a heading 3</h3>
    <p>This paragraph is styled by the universal selector.</p>
    
</body>
</html>
