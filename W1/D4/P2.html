<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout System</title>
    <style>
        .grid-pixels {
            display: grid;
            grid-template-columns: 100px 150px 200px;
            gap: 10px;
            
        }
        .grid-percentage {
            display: grid;
            grid-template-columns: 30% 40% 30%;
            gap: 10px;
            margin-top: 10px;
            
        }
        .grid-fractional {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 10px;
            margin-top: 10px;
            
        }
        .item {
            background-color: lightblue;
            border: 1px solid #000;
            padding: 20px;
            margin-top: 10px;;
            
        }  
    </style>
</head>
<body>
    <!-- Fixed width with column using pixels -->
     <div class="grid-pixels">
        <div class="item">100px</div>
        <div class="item">150px</div>
        <div class="item">200px</div>
     </div>
     <!-- Fixed width with column using percentage -->
     <div class="grid-percentage">
        <div class="item">30%</div>
        <div class="item">40%</div>
        <div class="item">30%</div>
     </div>
     <!-- Fixed width with column using Fractional columns -->
     <div class="grid-fractional">
        <div class="item">1fr</div>
        <div class="item">2fr</div>
        <div class="item">1fr</div>
     </div>
</body>
</html>
