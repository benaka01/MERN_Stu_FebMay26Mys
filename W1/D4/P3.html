<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout System- Fractional layout</title>
    <style>
        
        .grid-fractional {
            display: grid;
            grid-template-columns: repeat(3,1fr);  /*Create 3 equal columns using repeat function*/
            gap: 10px;
            margin-top: 10px;
            
        }
        .item {
            background-color: lightblue;
            border: 1px solid #000;
            padding: 20px;
            margin-top: 10px;
            
        }  
    </style>
</head>
<body>
    
     <!-- Fixed width with column using Fractional columns -->
     <div class="grid-fractional">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
     </div>
</body>
</html>
