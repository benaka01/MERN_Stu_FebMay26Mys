<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout : Auto-fit and Auto-fill</title>
    <style>
        
        .grid-fr {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); /*Auto-fit and Auto-fill with minmax function*/
            gap: 10px;
            column-gap: 10px;
            row-gap: 10px;
           
            
        }
        .item {
            background-color: lightblue;
            border: 1px solid #000;
            padding: 20px;
            margin: 10px;;
            
        }  
    </style>
</head>
<body>
    
     <!-- CSS Grid Layout : Auto-fit and Auto-fill -->
     <div class="grid-fr">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
     </div>
      <div class="grid-fr">
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
     </div>
</body>
</html>
