<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning Elements : Static</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: blueviolet;
        }
        .box {
            position: static;
            border: 2px solid black;
            width: 200px;
            height: 100px;
            background-color: lightblue;
            border-radius: 10px;
            box-shadow: 10px 10px  rgba(247, 2, 2, 0.5);
            padding: 20px;
            margin: 30px;
            color: darkgreen;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Static Position</h2>
    <div class="box"> Static box</div>
</body>
</html>
