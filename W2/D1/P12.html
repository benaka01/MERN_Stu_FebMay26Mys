<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Introduction @Media Rules</title>
    <style>
        .notice{
            padding:20px;
            text-align: center;
            font-weight: bold;
            
        }
        .notice{
            background-color: aquamarine;
        }
        @media screen and (min-width: 600px) and (max-width: 900px)  {
            .notice{
                background-color: lightcoral;
            }
        
         
        }
        @media screen and (orientation: landscape)
        {
            body{
                background-color: green;
            }
        }
        
    </style>
</head>
<body>
    <div class="notice">Resize or rotate device

    </div>
</body>
</html>
