<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Position-Based UI Demo</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
}


.navbar {
    position: sticky;
    top: 0;
    background-color:red;
    padding: 12px;
}


.navbar a {
    color: black;
    text-decoration: none;
    margin-right: 20px;
    font-size: 16px;

}



.content {
    height: 1200px;
    padding-top: 40px;
    background: #f5f5f5;
}

.house-container {
    position: relative;
    width: 300px;
    height: 320px;
    margin: 50px auto;
}

.roof {
    position: absolute;
    border: 5px solid black;
    top: 0;
    left: 0px;
    width: 300px;
    height: 40px;
    background:orange;
    z-index: 2;
}

.house {
    position: absolute;
    border: 5px solid black;
    top: 40px;
    left: 40px;
    width: 220px;
    height: 240px;
    background-color:chartreuse;
    z-index: 1;
}

.window-left {
    position: absolute;
    border: 5px solid black;
    top: 40px;
    left: 20px;
    width: 35px;
    height: 70px;
    background: yellow;
}

.window-right {
    position: absolute;
    border: 5px solid black;
    top: 70px;
    right: 20px;
    width: 35px;
    height: 40px;
    background:purple;
}

.door {
    position: absolute;
    border: 5px solid black;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 55px;
    height: 90px;
    background: rgb(76, 0, 255);
}

.action-btn {
    position: relative;
    margin: 40px auto;
    display: block;
    padding: 12px 30px;
    font-size: 16px;
    background: #00796b;
    color: white;
    border: none;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.3s ease;
}

.action-btn:hover {
    background: red;
    transform: translateX(4px);
}


.ball {
    position: relative;
    width: 40px;
    height: 40px;
    background: red;
    border-radius: 50%;
    margin: 60px  auto;
    animation: bounce 1s infinite ease-in;
}

@keyframes bounce {
    0%   { top: 0; }
    50%  { top: 100px; }
    100% { top: 0; }
}


.footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: black;
    color: white;
    text-align: center;
    padding: 10px;
}
</style>
</head>

<body>


<div class="navbar">
    
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
        
    
</div>


<div class="content">

  
    <div class="house-container">
        <div class="roof"></div>

        <div class="house">
            <div class="window-left"></div>
            <div class="window-right"></div>
            <div class="door"></div>
        </div>
    </div>

 
    <button class="action-btn">Click Me</button>


    <div class="ball"></div>

</div>


<div class="footer">
    All Rights Reserved to US 2026.
</div>

</body>
</html>
