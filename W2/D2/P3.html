<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind- peer focus</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="m-6 space-y-4">
    <input type="text"  placeholder="Enter Your Name" class="border-2 border-gray-600 px-3 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-green-500 peer w-md">
    <p class="text-red-500 mt-2 hidden peer-focus:block ">I show up when input is focused. </p>
    <input type="checkbox" class="appearance-none w-5 h-5 border-2 border-gray-600 rounded-md checked:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-red-500">
    <input type="radio" class="appearance-none w-5 h-5 border-2 border-gray-600 rounded-md checked:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-red-500">
    </div>
</body>
</html>
