<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment W2 D2 -2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    



<div class="bg-gray-50 p-6 rounded-2xl shadow-lg m-6">

  <div class="flex justify-between items-center">

    <!-- Metrics Section -->
    <div class="flex gap-12">

      <!-- Metric 1 -->
      <div>
        <p class="text-gray-600">Active Users</p>
        <p class="text-xl font-bold">12,540</p>
        <span class="inline-flex items-center bg-green-100 text-green-700 px-3 py-1 rounded-full mt-2">
          Up
        </span>
      </div>

      <!-- Metric 2 -->
      <div>
        <p class="text-gray-600">Revenue</p>
        <p class="text-xl font-bold">$48,900</p>
        <span class="inline-flex items-center bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full mt-2">
          Stable
        </span>
      </div>

      <!-- Metric 3 -->
      <div>
        <p class="text-gray-600">Server Load</p>
        <p class="text-xl font-bold">78%</p>
        <span class="inline-flex items-center bg-red-100 text-red-700 px-3 py-1 rounded-full mt-2">
          Down
        </span>
      </div>

    </div>

    <!-- Action Button -->
    <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg shadow">
      Download Report
    </button>

  </div>

  <!-- Inline Alert -->
  <div class="bg-red-100 border-l-4 border-red-500 p-3 rounded-lg mt-6">
    <p class="leading-relaxed">
      Performance degradation detected in Region 2. Monitoring closely.
    </p>
  </div>

</div>

</html>
