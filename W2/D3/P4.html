<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive orientation switch</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <section class="p-6 border rounded-lg space-y-6">
        <h2 class="text-xl font-bold">Flex-col on Mobile, Flex-row on Medium</h2>
        <div class="border rounded-lg p-4 gap-4 flex flex-col md:flex-row ">
            <div class="bg-gray-100 rounded p-4 flex-1">Block A</div>
            <div class="bg-gray-100 rounded p-4 flex-1">Block B</div>
            <div class="bg-gray-100 rounded p-4 flex-1">Block C</div>
            
        </div>
        
    </section>
</body>
</html>
