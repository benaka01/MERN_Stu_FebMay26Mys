<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanning of columns</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <main class="max-w-4xl mx-auto p-6 space-y-8">
        <section class="border rounded p-6 space-y-4 ">
            <span class="font-bold">Divide-x-axis</span>
            <div class="flex divide-x-2 divide-gray-500 rounded border overflow-hidden">
                <div class="p-4 flex-1">
                    <div class="text-sm"> Students </div>
                    <div class="text-xl font-bold">46  </div>
                </div>
                <div class="p-4 flex-1">
                    <div class="text-sm"> Placed </div>
                    <div class="text-xl font-bold">100%  </div>
                </div>
                <div class="p-4 flex-1">
                    <div class="text-sm"> Progress </div>
                    <div class="text-xl font-bold">10%  </div>
                </div>
            </div>
        </section>

        <section class="border rounded p-6 space-y-6">
            <span class="font-bold">
Divide-y-axis
            </span>
            <div class="divide-y-2 divide-red-300">
                <div class="p-4 flex items-center justify-between ">
                    <div class="font-bold">Notification</div>
                    <div class="font-sm text-green-800">EMail:SMS</div>
                     <button class="px-3 py-2 rounded border hover:bg-red-800">Edit</button>
                </div>
                
               <div class="p-4 flex items-center justify-between ">
                    <div class="font-bold">Privacy Settings</div>
                    <div class="font-sm text-green-800">EMail:SMS</div>
                     <button class="px-3 py-2 rounded border hover:bg-red-800">Edit</button>
                </div>
               
            </div>
        </section>
        <!-- <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 auto-rows-[160px]">
            <article class="border rounded p-6 lg:row-span-2">
                <div class="mt-4 h-20 rounded bg-green-200">
                    Col span
                </div>
            </article>
            <article class="border rounded p-6">Tile A</article>
            <article class="border rounded p-6">Tile B</article>
            <article class="border rounded p-6">Tile C</article>
            <article class="border rounded p-6">Tile D</article>

        </section> -->
    </main>
</body>
</html>
