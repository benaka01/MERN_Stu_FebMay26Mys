<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Objects,arrays</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <pre id="out">

    </pre>    
    <button id="runbtn" class="px-3 py-1 rounded-lg m-2 border bg-gray-700 text-white">Run</button>
 
    <script>
        const out = document.getElementById("out");
        function print(...args){

            console.log(...args);
            out.textContent+=args.join("")+"\n";
        }
        function clearOut(){
            out.textContent="";
        }
        function run(){
            clearOut();
            // creating objects
           const user = {name:"Benaka",age:20};
        //    Stringify converts objects into strings
           print("User = ",JSON.stringify(user));
// Arrays
           const arr=[1,2,3,4,5,6];
           print(arr.push());
           print("Is it an array :",Array.isArray(arr));
        }     
        document.getElementById("runbtn").addEventListener("click",run);
    </script>
</body>
</html>
